<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v5</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body style="background-color: var(--background);">

    <main class="container" style="padding: var(--space-xl) var(--space-lg);">
        <div class="card">
            <h2>Testes de Mídia e Formulário</h2>

            <p><a href="../../index.html" target="o teste 5">abrir página inicial</a></p>
            <iframe name="o teste 5" width="600" height="300">abrir</iframe>

            <form class="mt-lg">
                <h3>Formulário de Contato</h3>

                <label for="campo">Nome</label>
                <input id="campo" type="text" placeholder="digite seu nome aqui" required>

                <label for="senha">Senha</label>
                <input id="senha" type="password" placeholder="digite sua senha aqui" required>

                <label for="gmail">Email</label>
                <input id="gmail" type="email" placeholder="digite seu email aqui" required>

                <input id="enviar" type="submit" value="enviar">

                <fieldset style="border: none; padding: 0; margin: var(--space-md) 0;">
                    <legend style="font-weight: 500; margin-bottom: var(--space-sm);">Escolha um animal:</legend>
                    <label for="gato"><input id="gato" type="radio" name="animal" value="gato"> Gato</label><br>
                    <label for="cachorro"><input id="cachorro" type="radio" name="animal" value="cachorro">
                        Cachorro</label><br>
                    <label for="cobra"><input id="cobra" type="radio" name="animal" value="cobra"> Cobra</label>
                </fieldset>

                <h3>o que você tem em casa?</h3>
                <label for="item1"><input id="item1" type="checkbox" name="item1" value="TV"> TV</label><br>
                <label for="item2"><input id="item2" type="checkbox" name="item2" value="cadeira"> Cadeira</label><br>
                <label for="item3"><input id="item3" type="checkbox" name="item3" value="sapato"> Sapato</label>

                <select>
                    <option selected disabled value="selecione">Escolha uma cor</option>
                    <option value="vermelho">Vermelho</option>
                    <option value="amarelo">Amarelo</option>
                    <option value="azul">Azul</option>
                </select>

                <textarea name="mensagem" placeholder="digite sua mensagem" rows="15"></textarea>
            </form>

            <button class="mt-md">clique aqui</button>

            <div class="mt-lg">
                <audio controls>
                    <source src="../../assets/audios/WhatsApp Ptt 2026-04-27 at 18.56.57.ogg" type="audio/ogg">
                </audio>

                <audio controls>
                    <source src="../../assets/audios/WhatsApp Audio 2026-04-27 at 19.02.31.ogg" type="audio/ogg">
                </audio>

                <audio controls>
                    <source src="../../assets/audios/WhatsApp Audio 2026-04-27 at 19.02.31(1).ogg" type="audio/ogg">
                </audio>
            </div>

            <div class="mt-lg">
                <video
                    poster="../../assets/images/hot-anime-girl-lying-on-her-bed-with-backless-pink-skirt-wallpaper-2560x1080_14.jpg"
                    width="100%" controls>
                    <source src="../../assets/videos/WhatsApp Video 2026-04-27 at 19.11.21(1).mp4" type="video/mp4">
                </video>

                <video poster="../../assets/images/anime-style-illustration-rose.jpg" width="100%" controls>
                    <source src="../../assets/videos/WhatsApp Video 2026-04-27 at 19.14.35.mp4" type="video/mp4">
                </video>

                <video poster="../../assets/images/images.jpeg" width="100%" controls>
                    <source src="../../assets/videos/WhatsApp Video 2026-04-27 at 19.14.54.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="card mt-lg">
            <h3>Navegação</h3>
            <p><a href="../../pages/rotas/v1.html">ir para o primeiro teste</a></p>
            <p><a href="../../pages/audios.html">teste da tag de audios</a></p>
            <p><a href="../../pages/instagram.html">teste da tag video</a></p>
            <p><a href="../../pages/rotas/v6.html">ir para o sexto teste</a></p>
        </div>

</html>
